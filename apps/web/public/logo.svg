<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    .cell { fill: #2563EB; }
    @media (prefers-color-scheme: dark) {
      .cell { fill: #F1F5F9; }
    }
  </style>

  <!-- Four rounded squares in a pinwheel: the top-right to bottom-left
       diagonal solid, the other tinted to 0.3. -->
  <rect class="cell" x="0" y="0" width="61.12" height="61.12" rx="12.22" opacity="0.3"/>
  <rect class="cell" x="66.88" y="0" width="61.12" height="61.12" rx="12.22" opacity="1"/>
  <rect class="cell" x="0" y="66.88" width="61.12" height="61.12" rx="12.22" opacity="1"/>
  <rect class="cell" x="66.88" y="66.88" width="61.12" height="61.12" rx="12.22" opacity="0.3"/>
</svg>

# Core CI pipeline: lint, type-check, unit tests, and build verification.
# Runs on every PR targeting main or dev and on pushes to either. dev is where
# all work lands, directly or through a claude/* pull request, so gating only
# main let broken commits sit on dev until the next release PR.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Read-only by default. Nothing in this pipeline writes to the repo, and a
# dependency executing during install should never inherit a token that can.
permissions:
  contents: read

# Cancel superseded runs on the same PR.
# Push-to-main runs use the SHA so each commit is verified independently.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx turbo run lint
      - run: npx prettier --check .

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:verify

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # A normal run takes 11 to 21 minutes. A hung run once sat silent for 38,
    # and without a ceiling GitHub waits six hours, blocking every merge.
    timeout-minutes: 30
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test

  mobile-verify:
    name: Mobile Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx turbo run type-check --filter=@dubgrid/mobile
      - run: npx turbo run test --filter=@dubgrid/mobile --filter=@dubgrid/schedule-core --filter=@dubgrid/contracts

  integration-test:
    name: Integration Tests (live DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      # Well-known Supabase CLI local dev keys (deterministic, not secrets).
      # See: https://supabase.com/docs/guides/local-development
      LOCAL_SUPABASE_URL: http://127.0.0.1:54321
      LOCAL_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      LOCAL_SUPABASE_DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Seeding needs @prisma/engines binaries, which only arrive via the
      # allowlisted rebuild now that install scripts are off by default.
      # A postinstall download (Prisma engines, Sentry CLI) can drop mid-transfer
      # with "Error: aborted", which failed a whole Playwright shard before any
      # test ran (#441); retry the download rather than the job.
      - run: |
          for attempt in 1 2 3; do
            npm run deps:rebuild && exit 0
            echo "deps:rebuild failed (attempt $attempt of 3)"
            sleep $((attempt * 10))
          done
          exit 1
      # The integration suite imports workspace packages (e.g. @dubgrid/authz)
      # by their built dist/ entry, and this job calls vitest directly instead
      # of through turbo, so nothing else builds them first.
      - run: npm run build:packages

      # The CLI is the `supabase` dev dependency, so CI runs the version local
      # and production commands do. This job pulls the stack's images in the
      # same burst as every Playwright shard, and the registry can answer with
      # "Rate exceeded"; the CLI then trips over its own half-started database
      # ("port 54322 already in use"). As in e2e.yml, a failed start is cleared
      # and retried after a growing pause instead of failing the job.
      - name: Start Supabase
        run: |
          for attempt in 1 2 3 4; do
            npx supabase start && exit 0
            echo "supabase start failed (attempt $attempt of 4)" >&2
            npx supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1

      - name: Seed database
        run: npx tsx seed.ts
        env:
          FORCE_LOCAL_DB: "1"

      - name: Run integration tests
        working-directory: apps/web
        run: npx vitest run --config vitest.config.mts integration.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # A postinstall download (Prisma engines, Sentry CLI) can drop mid-transfer
      # with "Error: aborted", which failed a whole Playwright shard before any
      # test ran (#441); retry the download rather than the job.
      - run: |
          for attempt in 1 2 3; do
            npm run deps:rebuild && exit 0
            echo "deps:rebuild failed (attempt $attempt of 3)"
            sleep $((attempt * 10))
          done
          exit 1

      # Step-scoped, not job-scoped. The install above unpacks ~8,500
      # third-party packages; anything executing during that step can read the
      # entire environment. SUPABASE_SECRET_KEY bypasses every RLS policy
      # we have and SENTRY_AUTH_TOKEN can publish releases, so neither exists
      # until the build itself runs.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_DOMAIN: ${{ secrets.NEXT_PUBLIC_BASE_DOMAIN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_VERCEL_URL: ${{ secrets.NEXT_PUBLIC_VERCEL_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

# End-to-end tests using Playwright against a local Supabase instance.
# Runs on every PR targeting main, and can also be triggered manually.

name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      all_browsers:
        description: "Run all browsers (chromium, firefox, webkit)? Default: chromium only."
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      # Well-known Supabase CLI local dev keys (deterministic, not secrets).
      # See: https://supabase.com/docs/guides/local-development
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SECRET_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_DOMAIN: localhost
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Seeding needs @prisma/engines binaries, which only arrive via the
      # allowlisted rebuild now that install scripts are off by default.
      - run: npm run deps:rebuild

      - name: Install Playwright browsers
        run: |
          if [ "${{ inputs.all_browsers }}" = "true" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: "2.111.0" # pinned: `latest` silently adopts any new CLI build

      - name: Start Supabase
        run: supabase start

      - name: Seed database
        run: npx tsx seed.ts
        env:
          FORCE_LOCAL_DB: "1"

      # Rate limiting must not be null under `next start`'s NODE_ENV=production —
      # without these, checkRateLimit() fails closed on every call (see
      # apps/web/src/lib/rate-limit.ts) and login 503s for every Playwright spec.
      #
      # Browser qualification uses a dedicated Upstash database: repeated/retried
      # seeded-account logins must never share state or monitoring noise with
      # production. The job fails explicitly until these E2E-only secrets exist;
      # it must not fall back to production credentials.
      # Scoped to the two steps that need them, so secrets never sit in the
      # environment while `npm ci` unpacks third-party packages.
      - name: Verify dedicated rate-limit credentials
        env:
          E2E_UPSTASH_REDIS_REST_URL: ${{ secrets.E2E_UPSTASH_REDIS_REST_URL }}
          E2E_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.E2E_UPSTASH_REDIS_REST_TOKEN }}
        run: |
          test -n "$E2E_UPSTASH_REDIS_REST_URL" && test -n "$E2E_UPSTASH_REDIS_REST_TOKEN" || {
            echo "E2E-only Upstash Redis credentials are required; production credentials are never used." >&2
            exit 1
          }

      - name: Build Next.js
        run: npm run build
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.E2E_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.E2E_UPSTASH_REDIS_REST_TOKEN }}

      - name: Start server
        run: npm run start > server.log 2>&1 &
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.E2E_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.E2E_UPSTASH_REDIS_REST_TOKEN }}
          # The suite logs in as the same handful of seeded QA accounts from
          # 10+ spec files against a real (non in-memory) Upstash instance;
          # the production default of 15 per 15 minutes is well below a full
          # run's real login volume, especially with retries.
          LOGIN_EMAIL_LIMIT_PER_15_MIN: "200"

      - name: Wait for server
        run: timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null 2>&1; do sleep 1; done'

      - name: Run Playwright tests
        run: |
          if [ "${{ inputs.all_browsers }}" = "true" ]; then
            npx playwright test
          else
            npx playwright test --project=chromium
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-log
          path: server.log
          retention-days: 7

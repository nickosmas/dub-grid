# Hourly sweeper for expired shift requests and invitations.
#
# This used to be a Vercel cron (apps/web/vercel.json), but Vercel's Hobby plan
# caps crons at once/day, so the hourly schedule failed every deployment. The
# route itself is unchanged — this just calls it on the hourly cadence it needs.
# The other (daily) crons stay in vercel.json since Hobby allows those.
#
# NOTE: GitHub Actions `schedule` triggers only fire from the default branch
# (main), so this starts running once merged to main — not from dev/PR branches.
# Use "Run workflow" (workflow_dispatch) to test it before then.
#
# Required repo secrets:
#   CRON_SECRET           — must match the deployment's CRON_SECRET env var
#   NEXT_PUBLIC_SITE_URL  — canonical production origin that serves the app
#                           directly (https://www.dubgrid.com). It must not be a
#                           host that redirects: the apex dubgrid.com 307s to www,
#                           and curl drops the Authorization header across a host
#                           hop, so a redirecting origin can never authenticate.

name: Cron — Expire Requests

on:
  schedule:
    - cron: "0 * * * *" # top of every hour (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-expire-requests
  cancel-in-progress: false

jobs:
  ping:
    name: Ping expire-requests endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ] || [ -z "${SITE_URL:-}" ]; then
            echo "::error::CRON_SECRET and NEXT_PUBLIC_SITE_URL repo secrets must both be set"
            exit 1
          fi
          url="${SITE_URL%/}/api/cron/expire-requests"
          echo "Calling $url"
          # Capture body + status; fail the job on any non-2xx so a broken cron is visible.
          # Deliberately no -L: curl strips the Authorization header on a
          # cross-host redirect, so following one just turns a 307 into a 401.
          # Report the redirect instead, with the target, so the cause is obvious.
          status=$(curl -sS -o /tmp/cron-body.txt -D /tmp/cron-headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url")
          echo "HTTP $status"
          cat /tmp/cron-body.txt
          echo
          if [ "$status" -ge 300 ] && [ "$status" -lt 400 ]; then
            # `|| true` — under `set -euo pipefail` a Location-less 3xx would
            # otherwise abort the script before it could report anything.
            location=$(grep -i '^location:' /tmp/cron-headers.txt | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)
            echo "::error::$url redirected (HTTP $status) to ${location:-an unknown location}. NEXT_PUBLIC_SITE_URL must be the origin that serves the app directly, not one that redirects to it."
            exit 1
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::expire-requests returned HTTP $status"
            exit 1
          fi
